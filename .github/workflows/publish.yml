name: Publish

# 打 v* 标签时通过 Trusted Publishing（GitHub OIDC）发布到 VS Code Marketplace，
# 无需在仓库里保存 PAT。策略配置见 Marketplace → publisher → Trusted Publishing。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$VERSION  tag=$TAG"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::tag ($TAG) 与 package.json ($VERSION) 不一致，请先同步版本号"
            exit 1
          fi

      - name: 运行回归检查
        run: npm test --if-present

      - name: 发布到 VS Code Marketplace
        run: npx --yes @vscode/vsce publish --oidc
